[package]
name = "android_phone_app"
version = "0.3.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
univis_ui = { path = "../.." }
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "std",
    "android-native-activity",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
] }

[[example]]
name = "android_phone"
path = "examples/android_phone.rs"
crate-type = ["bin"]

[package.metadata.android]
package = "com.univis.androidphone"
build_targets = ["aarch64-linux-android"]
apk_name = "univis-android-phone"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
label = "Univis Android Phone"

[package.metadata.android.application.activity]
orientation = "portrait"
launch_mode = "singleTop"
exported = true
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"
