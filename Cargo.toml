[package]
name = "univis_ui"
version = "0.2.0-alpha.3"
edition = "2024" # Rust 2024 edition is appropriate for modern development
description = "A high-performance, SDF-based hybrid world-space UI framework for the Bevy game engine."
authors = ["abdellah-haffout <abdellahhaffout9@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/univiseditor/univis_ui" # Replace with your actual repo URL
homepage = "https://github.com/univiseditor/univis_ui"
keywords = ["bevy", "ui", "sdf", "gamedev", "hud"]
categories = ["game-development", "gui", "rendering"]
exclude = [".github/*"] # Exclude heavy assets from the published crate

[workspace]
members = [
    ".",
    "crates/univis_ui_engine",
    "crates/univis_ui_style",
    "crates/univis_ui_interaction",
    "crates/univis_ui_widgets",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "std",
    "android-native-activity",
    "android_shared_stdcxx",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
    "common_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_pbr",
    "bevy_picking",
    "keyboard",
    "mouse",
] }

[features]
default = []
example_bloom = ["bevy/bevy_post_process"]

[dependencies]
bevy = { workspace = true }
univis_ui_engine = { path = "crates/univis_ui_engine", version = "0.2.0-alpha.3" }
univis_ui_style = { path = "crates/univis_ui_style", version = "0.2.0-alpha.3" }
univis_ui_interaction = { path = "crates/univis_ui_interaction", version = "0.2.0-alpha.3" }
univis_ui_widgets = { path = "crates/univis_ui_widgets", version = "0.2.0-alpha.3" }

[[example]]
name = "grid_columns"
path = "examples/grid/columns.rs"

[[example]]
name = "grid_tracks"
path = "examples/grid/tracks.rs"

[[example]]
name = "grid_auto_flow"
path = "examples/grid/auto_flow.rs"

[[example]]
name = "grid_item_placement"
path = "examples/grid/item_placement.rs"

[[example]]
name = "layout_flex"
path = "examples/layout/flex.rs"

[[example]]
name = "layout_masonry"
path = "examples/layout/masonry.rs"

[[example]]
name = "layout_stack"
path = "examples/layout/stack.rs"

[[example]]
name = "layout_radial"
path = "examples/layout/radial.rs"

[[example]]
name = "widgets_controls"
path = "examples/widgets/controls.rs"

[[example]]
name = "widgets_inputs"
path = "examples/widgets/inputs.rs"

[[example]]
name = "widgets_display"
path = "examples/widgets/display.rs"

[[example]]
name = "widgets_containers"
path = "examples/widgets/containers.rs"
