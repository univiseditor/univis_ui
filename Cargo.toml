[package]
name = "univis_ui"
version = "0.3.1"
edition = "2024"
description = "A high-performance, SDF-based hybrid world-space UI framework for the Bevy game engine."
authors = ["abdellah-haffout <abdellahhaffout9@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/univiseditor/univis_ui"
homepage = "https://github.com/univiseditor/univis_ui"
keywords = ["bevy", "ui", "sdf", "gamedev", "hud"]
categories = ["game-development", "gui", "rendering"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README_AR.md",
    "/RELEASE_NOTES.md",
    "/RELEASE_PREP_0.3.0.md",
    "/MIGRATION.md",
    "/MIGRATION_AR.md",
    "/ROADMAP.md",
    "/changelog.md",
    "/src/**",
    "/examples/**",
]

[workspace]
members = [
    ".",
    "crates/univis_ui_engine",
    "crates/univis_ui_style",
    "crates/univis_ui_interaction",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "std",
    "android-native-activity",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
    "common_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "tonemapping_luts",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_pbr",
    "bevy_picking",
    "mesh_picking",
    "zstd_rust",
    "keyboard",
    "mouse",
    "bevy_scene",
] }
parley = { version = "0.9.0", default-features = false, features = ["std"] }
swash = { version = "0.2" }


[features]
default = []
example_bloom = ["bevy/bevy_post_process"]

[dependencies]
bevy = { workspace = true }
univis_ui_engine = { path = "crates/univis_ui_engine", version = "0.3.1" }
univis_ui_style = { path = "crates/univis_ui_style", version = "0.3.1" }
univis_ui_interaction = { path = "crates/univis_ui_interaction", version = "0.3.1" }

