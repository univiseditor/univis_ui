name: Docs, Examples, and API Docs

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: cargo install mdbook --locked

      - name: Build mdBook
        run: mdbook build docs

  api_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - univis_ui_style
          - univis_ui_engine
          - univis_ui_interaction
          - univis_ui_widgets
          - univis_ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate public API docs for ${{ matrix.package }}
        run: cargo doc -p ${{ matrix.package }} --no-deps

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - univis_ui_engine
          - univis_ui_widgets
          - univis_ui_interaction
          - univis_ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check examples for ${{ matrix.package }}
        run: ./scripts/check_examples_serial_release.sh -p ${{ matrix.package }}
