<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Grid Layout (CSS Grid Equivalent)</title>
    <style>
        body {
            background-color: #0d1014; /* Deep slate background matching Rust example */
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        /* 
           The Main Grid Container 
           Corresponds to 'grid' entity in simple_blocks.rs
        */
        .grid-container {
            width: 800px;
            height: 400px;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.05); /* UNode::background_color */
            border-radius: 16px; /* UNode::border_radius */
            box-sizing: border-box;
            
            /* Activates CSS Grid */
            display: grid;
            /* 4 Columns (1fr each) -> template_columns in Rust */
            grid-template-columns: repeat(4, 1fr);
            /* 3 Rows with fixed heights -> template_rows in Rust */
            grid-template-rows: 60px 180px 100px;
            /* Gaps -> row_gap and column_gap in Rust */
            row-gap: 10px;
            column-gap: 10px;
        }

        /* Generic block styles */
        .block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 
           Below are the individual Grid Items (Blocks A-F) 
           which map directly to 'ULayoutGridItem' inside Rust USelf components:
        */

        /* 1. Block A (Header): Spans columns 1 to 4, Row 1 */
        .block-a {
            background-color: #3366cc; /* Blue */
            grid-column: 1 / span 4;   /* column_start: Some(1), column_span: 4 */
            grid-row: 1;               /* row_start: Some(1), row_span: 1 */
        }

        /* 2. Block B (Sidebar): Column 1, Spans rows 2 to 3 */
        .block-b {
            background-color: #cc4d4d; /* Red */
            grid-column: 1;            /* column_start: Some(1), column_span: 1 */
            grid-row: 2 / span 2;      /* row_start: Some(2), row_span: 2 */
        }

        /* 3. Block C (Main Content): Spans columns 2 to 3, Row 2 */
        .block-c {
            background-color: #33b366; /* Green */
            grid-column: 2 / span 2;   /* column_start: Some(2), column_span: 2 */
            grid-row: 2;               /* row_start: Some(2), row_span: 1 */
        }

        /* 4. Block D (Right Sidebar): Column 4, Row 2 */
        .block-d {
            background-color: #cc9933; /* Yellow/Orange */
            grid-column: 4;            /* column_start: Some(4), column_span: 1 */
            grid-row: 2;               /* row_start: Some(2), row_span: 1 */
        }

        /* 5. Block E (Bottom Left): Column 2, Row 3 */
        .block-e {
            background-color: #804dcc; /* Purple */
            grid-column: 2;            /* column_start: Some(2), column_span: 1 */
            grid-row: 3;               /* row_start: Some(3), row_span: 1 */
        }

        /* 6. Block F (Bottom Right): Spans columns 3 to 4, Row 3 */
        .block-f {
            background-color: #4d99cc; /* Cyan */
            grid-column: 3 / span 2;   /* column_start: Some(3), column_span: 2 */
            grid-row: 3;               /* row_start: Some(3), row_span: 1 */
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- Block A -->
        <div class="block block-a">
            <div class="title">Block A</div>
            <div class="desc">Col: 1..=4 | Row: 1</div>
        </div>

        <!-- Block B -->
        <div class="block block-b">
            <div class="title">Block B</div>
            <div class="desc">Col: 1 | Row: 2..=3</div>
        </div>

        <!-- Block C -->
        <div class="block block-c">
            <div class="title">Block C</div>
            <div class="desc">Col: 2..=3 | Row: 2</div>
        </div>

        <!-- Block D -->
        <div class="block block-d">
            <div class="title">Block D</div>
            <div class="desc">Col: 4 | Row: 2</div>
        </div>

        <!-- Block E -->
        <div class="block block-e">
            <div class="title">Block E</div>
            <div class="desc">Col: 2 | Row: 3</div>
        </div>

        <!-- Block F -->
        <div class="block block-f">
            <div class="title">Block F</div>
            <div class="desc">Col: 3..=4 | Row: 3</div>
        </div>
    </div>

</body>
</html>
