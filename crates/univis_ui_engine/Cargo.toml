[package]
name = "univis_ui_engine"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Layout and render engine for Univis UI."
repository = "https://github.com/univiseditor/univis_ui"
homepage = "https://github.com/univiseditor/univis_ui"

[features]
default = []
example_bloom = ["bevy/bevy_post_process"]

[dependencies]
bevy = { workspace = true }
univis_ui_style = { path = "../univis_ui_style", version = "0.3.1" }
