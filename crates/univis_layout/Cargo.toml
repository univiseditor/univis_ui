[package]
name = "univis_layout"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure, standalone, high-performance layout engine supporting CSS Grid, Flexbox, and Radial layouts."
repository = "https://github.com/univiseditor/univis_ui"
homepage = "https://github.com/univiseditor/univis_ui"

[features]
default = ["std"]
std = []
bevy_reflect = ["dep:bevy_reflect"]

[dependencies]
glam = { version = "0.32", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.19.0", default-features = false, optional = true, features = ["glam"] }
